databaseChangeLog:
  - changeSet:
      id: 005
      author: Albert G.
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_to_user
                    references: users_table(id)
              - column:
                  name: restaurant_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_to_restaurant
                    references: restaurants(id)
              - column:
                  name: order_date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: "CREATED"