databaseChangeLog:
  - changeSet:
      id: 002
      author: Albert G.
      changes:
        - createTable:
            tableName: restaurants
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true