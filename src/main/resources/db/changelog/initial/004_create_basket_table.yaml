databaseChangeLog:
  - changeSet:
      id: 004
      author: Albert G.
      changes:
        - createTable:
            tableName: basket
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: count
                  type: integer
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_basket_to_user
                    references: users_table(id)
                    deleteCascade: true
              - column:
                  name: dish_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_basket_to_dish
                    references: dishes(id)
                    deleteCascade: true