databaseChangeLog:
  - changeSet:
      id: 003
      author: Albert G.
      changes:
        - createTable:
            tableName: dishes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: price
                  type: decimal(10,2)
              - column:
                  name: restaurant_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_dish_to_restaurant
                    references: restaurants(id)
                    deleteCascade: true
