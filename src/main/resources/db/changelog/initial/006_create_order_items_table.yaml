databaseChangeLog:
  - changeSet:
      id: 006
      author: Albert G.
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_item_to_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: dish_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_item_to_dish
                    references: dishes(id)
              - column:
                  name: count
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: decimal(10,2)
                  constraints:
                    nullable: false